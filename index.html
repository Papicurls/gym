<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="theme-color" content="#121018">
<title>Gym</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one 480px dark glass panel, one screen at a time, phone-first logger. */
:root {
  --bg: #121018;
  --surface: #1c1a24;
  --surface-glass: rgba(28, 26, 36, 0.66);
  --fg: #f5f3fa;
  --fg-muted: #9994ac;
  --border: rgba(255, 255, 255, 0.12);
  --accent: #8b5cf6;
  --accent-strong: #a78bfa;
  --on-accent: #ffffff;
  --accent-2: #f0b429;
  --accent-glow: 139 92 246;
  --success-bg: rgba(74, 222, 128, 0.14);
  --success-fg: #4ade80;
  --success-border: rgba(74, 222, 128, 0.32);
  --error-bg: rgba(248, 113, 113, 0.14);
  --error-fg: #f87171;
  --error-border: rgba(248, 113, 113, 0.32);
  --live: #4ade80;
  --live-bg: rgba(74, 222, 128, 0.14);
  --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
  --font-body: 'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'Space Mono', 'Courier New', monospace;
  --motion-fast: 0.15s;
  --motion-medium: 0.4s;
  --ease-standard: cubic-bezier(0.22, 1.56, 0.64, 1);
  color-scheme: dark;
  background: var(--bg);
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
img { max-width: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(20px + env(safe-area-inset-top, 0px)) calc(28px + env(safe-area-inset-bottom, 0px));
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(70% 42% at 0% 0%, rgb(var(--accent-glow) / 0.30), transparent 72%),
    radial-gradient(48% 30% at 100% 0%, rgba(240, 180, 41, 0.10), transparent 72%),
    var(--bg);
}
body.is-dragging { -webkit-user-select: none; user-select: none; cursor: grabbing; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 2px; }
.mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* Panel */
.panel {
  position: relative;
  max-width: 480px;
  margin: 0 auto;
  padding: 30px 16px 24px;
  background: var(--surface-glass);
  -webkit-backdrop-filter: blur(20px);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: 0 30px 60px -24px rgba(0, 0, 0, 0.7), 0 2px 10px rgba(0, 0, 0, 0.25);
}
.panel::before {
  content: "";
  position: absolute;
  left: -1px; right: -1px; top: -1px;
  height: 8px;
  border-radius: 10px 10px 0 0;
  background: linear-gradient(90deg, rgba(245, 243, 250, 0.72), var(--accent));
}
.panel::after {
  content: "";
  position: absolute;
  left: -1px; right: -1px; bottom: -1px;
  height: 4px;
  border-radius: 0 0 10px 10px;
  background: var(--fg);
}
.foot { max-width: 480px; margin: 14px auto 0; text-align: center; font-size: 12px; color: var(--fg-muted); display: flex; flex-direction: column; gap: 4px; }
.foot p { margin: 0; }
.foot .warn { color: var(--error-fg); }

.screen { display: flex; flex-direction: column; gap: 18px; }
.screen.enter { animation: enter var(--motion-medium) ease-out both; }
@keyframes enter { from { opacity: 0.35; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* Type */
.title { font-family: var(--font-display); font-weight: 600; font-size: clamp(28px, 8vw, 34px); line-height: 1.05; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.tagline { margin: 6px 0 0; font-size: 14px; color: var(--fg-muted); }
.h-day { font-family: var(--font-display); font-weight: 600; font-size: 26px; line-height: 1.1; margin: 0; text-wrap: balance; }
.h-sec { font-family: var(--font-display); font-weight: 600; font-size: 20px; margin: 0; }
.note { margin: 0; font-size: 13px; color: var(--fg-muted); line-height: 1.5; }
.sub-label { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-muted); }
.stack { display: flex; flex-direction: column; gap: 10px; }
.stack-sm { display: flex; flex-direction: column; gap: 8px; }

/* Buttons */
.btn-primary {
  display: flex; align-items: center; justify-content: center;
  width: 100%; min-height: 48px; padding: 12px 16px;
  border-radius: 6px;
  background: linear-gradient(160deg, #a07af9 0%, var(--accent) 50%, #7041e3 100%);
  color: var(--on-accent);
  font-weight: 600;
  box-shadow: 0 8px 20px -10px rgb(var(--accent-glow) / 0.9);
  transition: transform var(--motion-fast) var(--ease-standard), box-shadow var(--motion-fast), background var(--motion-fast);
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 12px 24px -10px rgb(var(--accent-glow) / 0.95); }
.btn-primary.is-confirm { background: linear-gradient(160deg, #22a35a, #4ade80); color: #06301a; box-shadow: 0 8px 20px -10px rgba(74, 222, 128, 0.8); }
.btn-ghost {
  display: flex; align-items: center; justify-content: center;
  width: 100%; min-height: 46px; padding: 10px 16px;
  border: 1px solid var(--border); border-radius: 6px;
  color: var(--accent-strong); font-weight: 500;
  transition: border-color var(--motion-fast), background var(--motion-fast);
}
.btn-ghost:hover { border-color: rgba(167, 139, 250, 0.5); background: rgba(139, 92, 246, 0.06); }
.txt { display: inline-flex; align-items: center; min-height: 38px; padding: 0 4px; color: var(--accent-strong); font-weight: 500; font-size: 14px; }
.txt:hover { color: #c4b5fd; }
.txt.muted { color: var(--fg-muted); }
.txt.muted:hover { color: var(--fg); }
.txt.danger { color: var(--error-fg); }
.back { display: inline-flex; align-items: center; gap: 2px; min-height: 38px; padding-right: 10px; margin-left: -4px; color: var(--accent-strong); font-weight: 500; }
.back svg { flex: none; }

/* Pills and badges */
.live { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 999px; background: var(--live-bg); color: var(--live); border: 1px solid var(--success-border); font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; line-height: 1.2; white-space: nowrap; }
.live i { width: 6px; height: 6px; border-radius: 50%; background: var(--live); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.55); opacity: 1; } 50% { box-shadow: 0 0 0 4px rgba(74, 222, 128, 0); opacity: 0.55; } }
.badge { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: 0.02em; border: 1px solid var(--border); color: var(--fg-muted); white-space: nowrap; line-height: 1.3; }
.badge.is-logged { background: var(--success-bg); color: var(--success-fg); border-color: var(--success-border); }
.badge.is-new, .day-badge { background: rgba(139, 92, 246, 0.14); color: var(--accent-strong); border-color: rgba(139, 92, 246, 0.36); }
.day-badge { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; border: 1px solid rgba(139, 92, 246, 0.36); white-space: nowrap; }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
.empty { margin: 0; padding: 26px 0; text-align: center; color: var(--fg-muted); font-size: 14px; }

/* Home */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile.is-open { border-color: var(--accent-strong); }
.leg-pick { display: grid; gap: 10px; }
.leg-opt { display: flex; flex-direction: column; align-items: stretch; gap: 6px; width: 100%; text-align: left; transition: border-color var(--motion-fast); }
.leg-opt:hover { border-color: rgba(167, 139, 250, 0.45); }
.leg-opt.is-live { border-color: var(--success-border); }
.leg-head { display: flex; align-items: center; gap: 8px; }
.leg-lifts { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; padding-top: 10px; border-top: 1px solid var(--border); }
.leg-lifts .pb-name, .leg-lifts .pb-sets { display: block; }
.tile {
  display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
  min-height: 98px; padding: 16px 14px; text-align: left;
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  transition: border-color var(--motion-fast), transform var(--motion-fast) var(--ease-standard);
}
.tile:hover { border-color: rgba(167, 139, 250, 0.45); }
.tile.is-live { border-color: var(--success-border); box-shadow: inset 0 0 0 1px var(--success-border); }
.tile-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; width: 100%; flex-wrap: wrap; }
.tile-name { font-family: var(--font-display); font-size: 20px; font-weight: 600; line-height: 1.15; }
.tile-sub { font-size: 13px; color: var(--fg-muted); line-height: 1.35; }
.hint { margin: 0; font-size: 14px; color: var(--fg-muted); }
.hint b { color: var(--accent-strong); font-weight: 600; }
.toast { margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--success-bg); color: var(--success-fg); border: 1px solid var(--success-border); font-size: 14px; }

.cc-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.cc-title { margin: 0; font-size: 15px; font-weight: 600; }
.cc-score { display: flex; align-items: baseline; gap: 8px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 16px; white-space: nowrap; }
.delta { font-size: 12px; }
.up { color: var(--success-fg); }
.down { color: var(--error-fg); }
.flat { color: var(--fg-muted); }
.chart-host { width: 100%; position: relative; }
.chart { display: block; overflow: visible; }
.ch-grid { stroke: rgba(255, 255, 255, 0.07); stroke-width: 1; }
.ch-tick { fill: var(--fg-muted); font-family: var(--font-mono); font-size: 10px; }
.ch-guide { stroke: rgba(255, 255, 255, 0.18); stroke-width: 1; stroke-dasharray: 3 3; }
.ch-hit { cursor: pointer; }
.ch-detail { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.cd-top { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; }
.cd-val { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 16px; }
.cd-date { color: var(--fg-muted); }
.cd-lifts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
.cd-lifts li { display: flex; justify-content: space-between; gap: 10px; }
.cd-lifts .mono { white-space: nowrap; }
.cd-sets { font-family: var(--font-mono); font-size: 12px; color: var(--fg-muted); line-height: 1.6; }
.cd-best { color: var(--fg-muted); }
.cd-best .mono { color: var(--fg); }

.prog {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center;
  width: 100%; padding: 10px 12px; text-align: left;
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  transition: border-color var(--motion-fast);
}
.prog:hover { border-color: rgba(167, 139, 250, 0.45); }
.prog-l { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.prog-name { font-weight: 600; }
.prog-last { font-family: var(--font-mono); font-size: 12px; color: var(--fg-muted); }
.prog-r { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.prog-score { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 12px; white-space: nowrap; }

.past { padding: 0; }
.past-head { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 50px; padding: 10px 14px; text-align: left; }
.past-date { font-weight: 600; }
.past-count { margin-left: auto; font-size: 13px; color: var(--fg-muted); white-space: nowrap; }
.chev { color: var(--fg-muted); transition: transform var(--motion-fast); }
.past.open .chev { transform: rotate(90deg); }
.past-body { display: flex; flex-direction: column; gap: 10px; padding: 0 14px 14px; border-top: 1px solid var(--border); padding-top: 12px; }
.pb-name { font-weight: 500; font-size: 14px; }
.pb-sets { font-family: var(--font-mono); font-size: 12px; color: var(--fg-muted); line-height: 1.6; }

/* Workout */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: -8px; }
.save-note { font-size: 12px; color: var(--fg-muted); text-align: right; }
.save-note.bad { color: var(--error-fg); }
.w-title { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; }
.w-cancel { margin-left: auto; }
.w-hint { margin: -10px 0 0; font-size: 13px; color: var(--fg-muted); }
.ex-list { display: flex; flex-direction: column; gap: 10px; }
.ex {
  display: flex; flex-direction: column; gap: 10px; padding: 12px;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  transition: border-color var(--motion-fast);
}
.ex input, .ex textarea { -webkit-user-select: text; user-select: text; }
.ex.is-logged { border-color: var(--success-border); }
.ex.shifting { transition: transform 0.18s ease, border-color var(--motion-fast); }
.ex.dragging {
  position: relative; z-index: 5;
  transform: translateY(var(--dy, 0px)) scale(1.02);
  border-color: var(--accent);
  box-shadow: 0 22px 44px -12px rgba(0, 0, 0, 0.8), 0 0 0 1px var(--accent);
  transition: box-shadow var(--motion-fast), border-color var(--motion-fast);
}
.ex-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; }
.ex-name { flex: 1 1 auto; font-weight: 600; font-size: 16px; line-height: 1.3; padding-top: 8px; min-width: 0; }
.grip {
  flex: none; width: 30px; height: 38px; margin-left: -6px; display: grid; place-items: center;
  color: var(--fg-muted); cursor: grab; touch-action: none; -webkit-touch-callout: none;
}
.ex.dragging .grip { color: var(--accent-strong); }
.w-hint svg { vertical-align: -2px; }
.ex-tools { display: flex; align-items: center; flex: none; margin-right: -4px; }
.icon-btn { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 6px; color: var(--fg-muted); }
.icon-btn:hover { color: var(--fg); }
.icon-btn.on { color: var(--accent-strong); background: rgba(139, 92, 246, 0.14); }
.badge-btn { min-height: 38px; padding: 6px 4px 6px 8px; display: flex; align-items: center; }
.done-mark { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 11px 0 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--fg-muted); font-size: 13px; font-weight: 600; white-space: nowrap; transition: background var(--motion-fast), color var(--motion-fast), border-color var(--motion-fast); }
.done-mark i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; }
.badge-btn:hover .done-mark { color: var(--fg); }
.done-mark.is-done { background: var(--success-fg); border-color: var(--success-fg); color: #06301a; }
.ex-note { display: flex; align-items: flex-start; gap: 8px; width: 100%; margin: -4px 0 -2px; padding: 8px 10px; border-radius: 8px; background: rgba(240, 180, 41, 0.08); border: 1px solid rgba(240, 180, 41, 0.28); color: var(--fg); font-size: 14px; line-height: 1.4; text-align: left; }
.ex-note svg { flex: none; margin-top: 1px; color: var(--accent-2); }
.ex-note span { white-space: pre-wrap; overflow-wrap: anywhere; }
.note-edit { display: flex; flex-direction: column; gap: 8px; }
.note-edit textarea.field { min-height: 72px; }
.note-btns { display: flex; align-items: center; gap: 12px; }
.note-btns .btn-primary { width: auto; min-height: 42px; padding: 0 18px; }
.ex-chart { display: flex; flex-direction: column; gap: 4px; padding: 10px; border-radius: 8px; background: rgba(0, 0, 0, 0.18); border: 1px solid var(--border); }
.ex-chart .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.ch-line { font-size: 12px; color: var(--fg-muted); }
.ch-line .mono { color: var(--fg); }

.sets { display: flex; flex-direction: column; gap: 6px; }
.set { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px; align-items: center; }
.rir {
  flex: none; width: 34px; height: 38px; border-radius: 6px;
  border: 1px dashed var(--border); color: var(--fg-muted);
  font-size: 10px; font-weight: 600; letter-spacing: 0.06em;
  transition: background var(--motion-fast), border-color var(--motion-fast), color var(--motion-fast);
}
.rir:hover { color: var(--fg); }
.rir.on { border-style: solid; border-color: var(--accent); background: rgba(139, 92, 246, 0.22); color: var(--fg); }
.side-line { display: flex; align-items: center; justify-content: space-between; gap: 4px 8px; flex-wrap: wrap; margin: -6px 0 -4px; font-size: 13px; color: var(--fg-muted); }
.range-slot { display: contents; }
.range-line { display: flex; align-items: flex-start; gap: 6px; margin: -6px 0 -4px; font-size: 13px; line-height: 1.4; color: var(--accent-2); }
.range-line svg { flex: none; margin-top: 2px; }
.step.nudge { border-color: rgba(240, 180, 41, 0.75); background: rgba(240, 180, 41, 0.12); color: var(--accent-2); }
.save-warn { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 12px; border-radius: 8px; background: var(--error-bg); color: var(--error-fg); border: 1px solid var(--error-border); font-size: 13px; line-height: 1.4; }
.save-warn .txt { color: var(--error-fg); flex: none; }
.cl { display: flex; align-items: center; gap: 3px; min-width: 0; }
.step {
  flex: none; width: 38px; height: 38px; border-radius: 6px;
  border: 1px solid var(--border); background: rgba(255, 255, 255, 0.03);
  font-size: 19px; line-height: 1; display: grid; place-items: center; color: var(--fg);
  transition: border-color var(--motion-fast), transform var(--motion-fast) var(--ease-standard);
}
.step:hover { border-color: rgba(167, 139, 250, 0.5); }
.val { flex: 1; min-width: 0; min-height: 44px; padding: 2px; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.val:hover { background: rgba(255, 255, 255, 0.04); }
.cl-r .val { min-width: 42px; }
.v1 { font-size: 15px; line-height: 1.2; white-space: nowrap; }
.v2 { font-size: 11px; line-height: 1.25; color: var(--fg-muted); text-wrap: balance; }
.val-load.is-two .v1, .val-load.is-two .v2 { font-size: 13px; color: var(--fg); line-height: 1.25; }
.val-reps .v1 { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 18px; }
.val.is-guess .v1, .val.is-guess .v2 { color: var(--accent-2); }
.val.is-empty .v1 { color: var(--fg-muted); }

.editor {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  padding: 10px; border-radius: 8px;
  border: 1px solid var(--accent-2); background: var(--bg);
}
.editor input {
  width: 74px; min-height: 42px; padding: 8px;
  font-family: var(--font-mono); font-size: 16px; text-align: center;
  color: var(--fg); background: var(--surface);
  border: 1px solid var(--border); border-radius: 6px;
}
.editor input:focus { outline: none; border-color: var(--accent-2); }
.editor input::placeholder { color: var(--fg-muted); }
.editor input.is-guess-ph::placeholder { color: var(--accent-2); opacity: 0.8; }
.editor .w-sm { width: 60px; }
.editor .lbl { color: var(--fg-muted); font-size: 13px; }
.editor .done { width: auto; min-height: 42px; padding: 0 16px; margin-left: auto; }

.track-pick { display: flex; flex-direction: column; gap: 10px; }
.track-pick p { margin: 0; font-size: 14px; color: var(--fg-muted); }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { min-height: 38px; padding: 6px 14px; border-radius: 999px; border: 1px solid rgba(139, 92, 246, 0.45); color: var(--accent-strong); font-weight: 500; font-size: 14px; }

<script>
(() => {
'use strict';

/* ---------- Constants ---------- */
const KEY = 'chris-gym-v1';
// The home-screen app has no Claude database (window.claude only exists inside claude.ai), so this

const LEG_DAYS = ['quads', 'hams'];

const PR = (top, mid, reps) => ({ kind: 'preacher', top, mid, reps });

const STANDING = {
  upper: ['T-bar row', 'Shoulder press', 'Side delt fly', 'Pec deck', 'Unilateral lat pulldown', 'JM press', 'Rope extension', 'Rear delt fly', 'Preacher curl', 'ISO incline press', 'Converging incline press', 'Lat pulldown', 'SAG row'],
  // The two leg days as Chris does them (2026-11-05): the same lifts, in a different order.

  hams: ['SLDL', 'Hamstring curls', 'Booty bounces', 'Leg extensions', 'Adductors', 'Cable crunch'],

// Starting numbers only. Never sessions, never chart points.
const STARTER = {

  'shoulder press': [P(2, 0, 8), P(2, 0, 6)],
  'side delt fly': [L(197.5, 8), L(192.5, 7)],

  'iso incline press': [P(2, 35, 5), P(2, 25, 7)],

  'sag row': [L(305, 9), L(300, 8)],

  'hamstring curls': [L(185, 10), L(185, 8)],
  'adductors': [L(375, 10), L(375, 9)],
  'cable crunch': [L(100, 8), L(100, 8)],
  'rdl': [L(320, 7), L(315, 6)],

const ALIASES = {};
[
  [['lat raise', 'lat raises', 'side delt', 'side delts'], 'Side delt fly'],
  [['rear delt', 'rear delts'], 'Rear delt fly'],
  [['tricep extension', 'tricep extensions', 'triceps extension'], 'Rope extension'],

  [['curl', 'curls', 'preacher', 'preacher curls'], 'Preacher curl'],

  [['abs', 'cable crunches'], 'Cable crunch'],

const LOWER_NAMES = new Set(['hack squat', 'hamstring curls', 'adductors', 'cable crunch', 'rdl', 'leg press', 'booty bounces', 'leg extensions', 'sldl']);

const FORMATS = [['lb', 'Weight'], ['plates', 'Plates + weight'], ['stack', 'Top + bottom']];
const FORMAT_SAMPLE = { lb: '185 × 8', plates: '2 plates and 25 × 8', stack: '50 top / 30 bottom × 8' };

/* ---------- Small helpers ---------- */
const clone = (o) => (o == null ? o : JSON.parse(JSON.stringify(o)));
const r2 = (n) => Math.round(n * 100) / 100;
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  return String(s || '').toLowerCase().replace(/[-_]/g, ' ').replace(/\s+/g, ' ').trim();

const sameName = (a, b) => normalize(a) === normalize(b);

function parseNum(v, int) {
  const t = String(v == null ? '' : v).trim().replace(',', '.');
  if (!t) return null;
  const n = int ? parseInt(t, 10) : parseFloat(t);
  return Number.isFinite(n) ? n : null;
}

/* ---------- State ---------- */
const S = {
  config: null,
  live: { upper: null, quads: null, hams: null, updatedAt: 0 },
  sessions: {},
  ideas: {},
  nav: { screen: 'home', day: null, at: 0 },

const unsynced = new Set();
const erased = new Set(); // past workouts emptied by a delete, waiting to be removed from the db
const ideaUnsynced = new Set();

let db = null;
let dbState = 'connecting'; // connecting | ready | offline | local
let dbReady = false;
let retrying = false;
let retryDelay = 0;

const REST_DEFAULT = 120;

  addOpen: false, addErr: '',
  newName: '', newFmt: 'lb', newUni: false,

  lowerOpen: false, // the Quads / Hams choice under the Lower button

function defaultConfig() {
  return { base: clone(STANDING), exercises: clone(CATALOG), starter: clone(STARTER), hidden: [], updatedAt: 0, v: 3 };
}
// `base` holds each day's list of lifts (see planNames). Before v3 it only filled in for a new day.
function normConfig(c) {
  c = c || {};
  const base = Object.assign({}, c.base);
  for (const d of DAYS) if (!Array.isArray(base[d])) base[d] = clone(STANDING[d]);
  return {
    base,
    exercises: c.exercises || clone(CATALOG),
    starter: c.starter || {},
    hidden: Array.isArray(c.hidden) ? c.hidden : [],
    updatedAt: c.updatedAt || 0,
    v: c.v || 2,

}
function touchConfig() {
  S.config.updatedAt = Date.now();
  dirty.config = true;
}
function normLive(l) {
  l = l || {};
  const out = { updatedAt: l.updatedAt || 0 };
  for (const d of DAYS) out[d] = l[d] || null;
  // A Lower workout left open across the update carries on as the leg day it started like.
  if (l.lower && Array.isArray(l.lower.exercises)) {

/* ---------- Names ---------- */

  const n = normalize(raw);
  if (!n) return '';
  if (S.config.exercises[n]) return S.config.exercises[n].name;
  const alias = ALIASES[n];

/* ---------- History ---------- */
let sortedCache = null;

/* ---------- Building a workout ---------- */

        db.doc('gym/config').get(),
        db.doc('gym/live').get(),

        db.collection('gymSessions').limit(1000).get(),
        db.collection('gymIdeas').limit(1000).get(),

// Keeps the open workout in step with the db, so a second tab or phone can't save an old copy over it.

      if (!snap.exists || (snap.metadata && snap.metadata.hasPendingWrites)) return;
      const remote = normLive(clone(snap.data()));
      const mine = S.live.updatedAt || 0;
      if (remote.updatedAt > mine) {
        // Saved somewhere else more recently: show that version.
        S.live = remote;
        dirty.live = false;
        ui.editing = null;
        saveCache();
        autoFinishStale();
        render();
      } else if (remote.updatedAt < mine && !dirty.live) {
        // An older save arrived late: put the newer one back.
        dirty.live = true;
        scheduleFlush();
      }
    }, (err) => {
      liveUnsub = null;
      if (isTerminal(err)) goOffline();
      else setTimeout(subscribeLive, 5000);
    });
  } catch (err) { liveUnsub = null; }
}

    `<stop offset="0" stop-color="rgb(116,224,139)" stop-opacity="0.24"/><stop offset="1" stop-color="rgb(116,224,139)" stop-opacity="0"/></linearGradient></defs>`;

function renderHome() {

  const upperTile = upperW ? liveTile('upper', 'Upper', upperW)
    : `<button class="tile" data-act="open-day" data-day="upper"><span class="tile-name">Upper</span><span class="tile-sub">${plural(planNames('upper').length, 'exercise')}</span></button>`;
  // A leg day in progress opens straight from Lower. Two at once (rare) go through the choice.
  const liveLegs = LEG_DAYS.filter((d) => S.live[d]);
  const lowerTile = liveLegs.length === 1 ? liveTile(liveLegs[0], 'Lower', S.live[liveLegs[0]])
    : `<button class="tile${ui.lowerOpen ? ' is-open' : ''}" data-act="lower-pick" aria-expanded="${ui.lowerOpen}"><span class="tile-name">Lower</span><span class="tile-sub">Quads or hams</span></button>`;
  const tiles = upperTile + lowerTile;

  // Upper and lower take turns, and Quads and Hams take turns with each other.
  const newest = sessionsNewestFirst()[0];
  const lastLeg = sessionsNewestFirst().find(legDayOf);
  const nextLeg = lastLeg && legDayOf(lastLeg) === 'quads' ? 'hams' : 'quads';
  let hint = '';
  if (newest) {
    if (newest.day === 'upper') hint = `Split says <b>Lower · ${LEG_NAME[nextLeg]}</b>`;
    else if (newest.date === yesterdayStr()) hint = "Split says <b>rest day</b> — pick any if you're training";
    else hint = 'Split says <b>Upper</b>';
  }

  const charts = PARTS.map((part) => {
    const pts = indexSeries(part);
    const title = part === 'upper' ? 'Upper weights' : 'Leg weights';
    if (!pts.length) return `<section class="card"><div class="cc-head"><h3 class="cc-title">${title}</h3></div><p class="empty">No data yet.</p></section>`;
    const id = 'idx-' + part;
    const sel = registerChart(id, {
      values: pts.map((p) => p.value), dates: pts.map((p) => p.date), minSpan: 4, height: 150,
      label: `${title} index`, detail: (i) => idxDetail(pts, i),
    });
    const lastV = pts[pts.length - 1].value;
    const prevV = pts.length > 1 ? pts[pts.length - 2].value : null;
    const d = prevV ? (lastV / prevV - 1) * 100 : null;
    return `<section class="card"><div class="cc-head"><h3 class="cc-title">${title}</h3><div class="cc-score">${lastV.toFixed(1)}${d == null ? '' : `<span class="delta ${pctClass(d)}">${signPct(d)}</span>`}</div></div>` +
      `<div class="chart-host" data-chart-host="${id}" style="height:150px"></div>` +
      `<div class="ch-detail" data-chart-detail="${id}">${idxDetail(pts, sel)}</div></section>`;
  }).join('');

  const prog = progressionLifts();
  let progHtml = '';
  for (const part of PARTS) {
    const lifts = prog.filter((p) => p.part === part);
    if (!lifts.length) continue;
    progHtml += `<div class="stack-sm"><p class="sub-label">${PART_NAME[part]}</p>${lifts.map((l) => {
      const last = l.pts[l.pts.length - 1];
      return `<button class="prog" data-act="open-ex" data-name="${esc(l.name)}"><span class="prog-l"><span class="prog-name">${esc(l.name)}</span><span class="prog-last">top set ${esc(setText(last.best))}</span></span>` +
        `<span class="prog-r">${sparkSVG(l.pts.map((p) => p.weight), l.name + ' top weight')}<span class="prog-score">${esc(weightText(last.best))}</span></span></button>`;
    }).join('')}</div>`;
  }

  const past = sessionsNewestFirst();
  const pastList = ui.pastOpen ? `<div class="stack-sm">${past.map((s) => {
    const open = ui.pastExpanded.has(s.id);
    return `<div class="card past${open ? ' open' : ''}"><button class="past-head" data-act="past-item" data-id="${esc(s.id)}" aria-expanded="${open}"><span class="past-date">${esc(s.label || fmtDate(s.date))}</span><span class="day-badge">${DAY_NAME[s.day] || esc(s.day)}</span><span class="past-count">${plural(s.exercises.length, 'exercise')}</span><span class="chev" aria-hidden="true">›</span></button>` +
      (open ? `<div class="past-body">${s.exercises.map((e) => `<div><div class="pb-name">${esc(e.name)}</div><div class="pb-sets">${esc(setsText(e.sets))}</div></div>`).join('')}</div>` : '') + '</div>';
  }).join('')}</div>` : '';

  const nudge = LOCAL && isStandalone() && backupDue()
    ? `<p class="hint"><button class="txt" data-act="backup">${lastBackup ? `Last backup was ${backupAge()} days ago. Back up now` : 'Back up your workouts'} →</button></p>` : '';

  return `<header class="home-head"><div><h1 class="title">Gym</h1><p class="tagline">Upper · legs · rest</p></div>${ideaBtn()}</header>
    ${installHtml()}
    ${freshPhone() ? backupHtml() : ''}
    ${saveWarnHtml()}
    <div class="tiles">${tiles}</div>
    ${lowerPickHtml(nextLeg)}
    ${hint ? `<p class="hint">${hint}</p>` : ''}
    ${nudge}
    ${ui.toast ? `<p class="toast" role="status">${esc(ui.toast)}</p>` : ''}
    <div class="stack">${charts}<p class="note">100 = your first logged workout. Each point is a workout: every lift's heaviest weight is compared with the last time you did it, and the line moves by the average change.</p></div>
    <section class="stack"><h2 class="h-sec">Exercise progression</h2><p class="note">Each point is the heaviest weight you used on that lift that day. Tap a lift for its full history.</p>${progHtml}</section>
    <section class="stack-sm"><div><button class="txt" data-act="toggle-past" aria-expanded="${ui.pastOpen}">${ui.pastOpen ? 'Hide past workouts' : `Past workouts (${past.length})`}</button></div>${pastList}</section>
    ${freshPhone() ? '' : backupHtml()}`;
}

/* ---------- Home-screen app: install note, backup, restore ---------- */
const isStandalone = () => window.navigator.standalone === true || !!(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
// Safari and the home-screen app keep separate storage on iPhone, so logging in Safari would split his data.
function installHtml() {
  if (!LOCAL || isStandalone()) return '';
  return '<p class="install"><b>Add Gym to your home screen:</b> tap Share, then Add to Home Screen, and open it from there. Workouts logged here in Safari stay in Safari.</p>';
}
const backupAge = () => (lastBackup ? Math.floor((Date.now() - lastBackup) / 86400000) : null);
function backupDue() {
  const a = backupAge();
  return Object.keys(S.sessions).length > 0 && (a == null || a >= BACKUP_DUE_DAYS);
}
const freshPhone = () => !Object.keys(S.sessions).length;
function backupHtml() {
  if (!LOCAL) return '';
  const fresh = freshPhone();
  const a = backupAge();
  const when = a == null ? 'No backup yet.' : `Last backup: ${a === 0 ? 'today' : a === 1 ? 'yesterday' : a + ' days ago'}.`;
  const r = ui.restore;
  const msg = ui.backupMsg ? `<p class="${ui.backupMsg.bad ? 'err' : 'toast'}" role="status">${esc(ui.backupMsg.text)}</p>` : '';
  const actions = r
    ? `<p class="note">This backup has ${plural(r.count, 'workout')}${r.last ? `, the newest from ${esc(fmtDate(r.last))}` : ''}. It replaces everything on this phone.</p>
      <div class="backup-row"><button class="btn-primary" data-act="restore-yes">Replace with this backup</button><button class="txt muted" data-act="restore-no">Cancel</button></div>`
    : fresh ? '<label class="btn-primary" for="restore-file">Restore from a backup</label>'
    : '<div class="backup-row"><button class="btn-ghost" data-act="backup">Back up now</button><label class="txt muted" for="restore-file">Restore from a backup</label></div>';
  if (fresh) {
    return `<section class="card stack-sm"><h2 class="h-sec">Bring over your workouts</h2>
      <p class="note">Your past workouts are in a backup file in iCloud Drive, named like gym-backup-2026-10-24.json. Tap Restore and pick it.</p>${msg}${actions}</section>`;
  }
  return `<section class="card stack-sm"><h2 class="h-sec">Backup</h2>
    <p class="note">Your workouts are saved on this phone only. Back up to iCloud Drive (Save to Files) so a new phone or a deleted app doesn't lose them.</p>
    <p class="backup-when${backupDue() ? ' due' : ''}">${when}</p>${msg}${actions}</section>`;
}

// iPhone: the share sheet's Save to Files puts it in iCloud Drive. Elsewhere: a download.
async function runBackup() {
  ui.backupMsg = null;
  const data = { app: 'gym', v: 1, exportedAt: Date.now(), config: S.config, live: S.live, sessions: S.sessions, ideas: S.ideas };
  const name = `gym-backup-${todayStr()}.json`;
  const file = new File([JSON.stringify(data)], name, { type: 'application/json' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'Gym backup' });
    } else {
      const url = URL.createObjectURL(file);
      const a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    }
    lastBackup = Date.now();
    saveCache();
    ui.backupMsg = { text: 'Backed up. Keep the file in iCloud Drive.' };
  } catch (err) {
    if (err && err.name === 'AbortError') return;
    ui.backupMsg = { text: `Couldn't save the backup: ${(err && err.message) || err}`, bad: true };
  }
  render();
}

// Every step shows a message, so a restore that stops partway says where.
async function onRestoreFile(ev) {
  const input = ev.target;
  const f = input.files && input.files[0];
  if (!f) return;
  ui.restore = null;
  ui.backupMsg = { text: `Reading ${f.name}…` };
  render();
  let d = null;
  try { d = JSON.parse(await f.text()); } catch (e) { d = null; }
  input.value = ''; // picking the same file again still counts as a change
  if (!d || typeof d !== 'object' || !d.config || !d.sessions || typeof d.sessions !== 'object') {
    ui.backupMsg = { text: `${f.name} isn't a Gym backup. Pick the file named like gym-backup-2026-10-24.json.`, bad: true };
  } else {
    const list = Object.values(d.sessions).filter(Boolean);
    ui.restore = { data: d, count: list.length, last: list.map((s) => s.date).filter(Boolean).sort().pop() || null };
    ui.backupMsg = null;
  }
  render();
}
function applyRestore() {
  const r = ui.restore;
  if (!r) return;
  // Keep what was on the phone, in case the wrong file got picked.
  try { localStorage.setItem(KEY + '-before-restore', localStorage.getItem(KEY) || ''); } catch (e) { /* no room: the restore still goes ahead */ }
  const d = r.data;
  S.config = normConfig(d.config);
  S.sessions = d.sessions;
  sessionsChanged();
  migrateConfig();
  S.live = normLive(d.live);
  S.ideas = d.ideas && typeof d.ideas === 'object' ? d.ideas : {};
  markBuiltIdeas();
  refreshUntouched();
  lastBackup = d.exportedAt || Date.now();
  autoFinishStale();
  ui.restore = null;
  ui.backupMsg = { text: `Restored ${plural(r.count, 'workout')}.` };
  ui.toast = `Restored ${plural(r.count, 'workout')}. They're listed under Past workouts.`;
  ui.pastOpen = true;
  settleLocal();
  render();
  window.scrollTo(0, 0);
}

function idxDetail(pts, i) {
  const p = pts[i];
  if (!p) return '';
  const prev = pts[i - 1];
  const pct = prev ? (p.value / prev.value - 1) * 100 : null;
  const lifts = p.changes.slice().sort((a, b) => (a.first ? -Infinity : a.pct) < (b.first ? -Infinity : b.pct) ? 1 : -1);
  return `<div class="cd-top"><span class="cd-val">${p.value.toFixed(1)}</span><span class="cd-date">${fmtDate(p.date)}</span>` +
    (pct == null ? '<span class="cd-date">First workout</span>' : `<span class="mono ${pctClass(pct)}">${signPct(pct)} vs previous</span>`) + '</div>' +
    `<ul class="cd-lifts">${lifts.map((l) => `<li><span>${esc(l.name)}</span>${l.first ? '<span class="flat">· first time</span>' : `<span class="mono ${pctClass(l.pct)}">${signPct(l.pct)}</span>`}</li>`).join('')}</ul>`;
}

function progressionLifts() {
  const names = new Map();
  for (const s of sessionsOldestFirst()) for (const e of s.exercises) {
    const k = normalize(e.name);
    if (!names.has(k) && topOf(e.sets)) names.set(k, e.name);
  }
  const b = S.config.base;
  const order = { upper: b.upper || [], lower: [...(b.quads || []), ...(b.hams || [])] };
  const rank = (name) => {
    const i = (order[partOf(name)] || []).findIndex((n) => sameName(n, name));
    return i < 0 ? 1000 : i;
  };
  return [...names.values()]
    .map((name) => ({ name, part: partOf(name), pts: liftPoints(name) }))
    .filter((l) => l.pts.length)
    .sort((a, b) => rank(a.name) - rank(b.name) || a.name.localeCompare(b.name));
}

function loadDisplay(s) {
  if (!hasLoad(s)) return { html: '<span class="v1">—</span><span class="v2">tap to type</span>', cls: 'is-empty' };
  const side = s.side || '';
  if (s.kind === 'plates') {
    const p = s.plates || 0;
    const l1 = `<span class="num">${fmt(p)}</span> ${p === 1 ? 'plate' : 'plates'}`;
    const parts = [];
    if (s.extra) parts.push(`and <span class="num">${fmt(s.extra)}</span>`);
    if (side) parts.push(side);
    return { html: `<span class="v1">${l1}</span>${parts.length ? `<span class="v2">${parts.join(', ')}</span>` : ''}`, cls: '' };
  }
  if (isTwo(s)) {
    return { html: `<span class="v1"><span class="num">${fmt(s.top || 0)}</span> top</span><span class="v2"><span class="num">${fmt(s.mid || 0)}</span> ${lowWord(s)}${side ? ', ' + side : ''}</span>`, cls: 'is-two' };
  }
  return { html: `<span class="v1 num">${fmt(s.lb)}</span>${side ? `<span class="v2">${side}</span>` : ''}`, cls: '' };
}

// A set that hit the top of the range last time lights up its + weight button.
const atTop = (e, s) => e.from === 'history' && !s.edited && !s.q && s.reps != null && s.reps >= rangeOf(e.name)[1];
function setRowInner(s, i, si, e) {
  const ld = loadDisplay(s);
  const guess = s.q && s.reps != null;
  const reps = s.reps == null ? '<span class="v1">–</span>' : `<span class="v1">${s.reps}</span>${guess ? '<span class="v2">guess</span>' : ''}`;
  const at = `data-i="${i}" data-si="${si}"`;
  const up = e && atTop(e, s);
  return `<div class="cl cl-w"><button class="step" data-act="w-step" ${at} data-d="-1" aria-label="Less weight">−</button>` +
    `<button class="val val-load ${ld.cls}" data-act="edit" data-f="load" ${at} aria-label="Weight: ${esc(hasLoad(s) ? loadText(s) : 'empty')}. Tap to type.">${ld.html}</button>` +
    `<button class="step${up ? ' nudge' : ''}" data-act="w-step" ${at} data-d="1" aria-label="More weight${up ? ', you hit the top of your range last time' : ''}">+</button></div>` +
    `<div class="cl cl-r"><button class="step" data-act="r-step" ${at} data-d="-1" aria-label="One less rep">−</button>` +
    `<button class="val val-reps${guess ? ' is-guess' : ''}${s.reps == null ? ' is-empty' : ''}" data-act="edit" data-f="reps" ${at} aria-label="Reps: ${s.reps == null ? 'empty' : s.reps + (guess ? ', predicted' : '')}. Tap to type.">${reps}</button>` +
    `<button class="step" data-act="r-step" ${at} data-d="1" aria-label="One more rep">+</button></div>` +
    `<button class="rir${s.rir ? ' on' : ''}" data-act="rir" ${at} aria-pressed="${!!s.rir}" aria-label="Kept a rep in reserve">RIR</button>`;
}

function editorHtml(s) {
  const inp = (f, val, ph, mode, label, cls) =>
    `<input id="ed-${f}" class="${cls || ''}" data-field="${f}" type="text" inputmode="${mode}" enterkeyhint="done" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="${esc(ph)}" value="${esc(val)}" aria-label="${label}">`;
  const guess = s.q && s.reps != null;
  const reps = inp('reps', guess ? '' : s.reps == null ? '' : s.reps, guess ? String(s.reps) : 'reps', 'numeric', 'Reps', 'w-sm' + (guess ? ' is-guess-ph' : ''));
  let f;
  if (s.kind === 'plates') {
    f = inp('plates', s.plates == null ? '' : s.plates, 'plates', 'numeric', 'Plates', 'w-sm') + '<span class="lbl">and</span>' +
      inp('extra', s.extra ? fmt(s.extra) : '', '0', 'decimal', 'Extra pounds', 'w-sm') + '<span class="lbl">×</span>' + reps;
  } else if (isTwo(s)) {
    const low = lowWord(s);
    f = inp('top', fmt(s.top), 'top', 'decimal', 'Top stack') + inp('mid', fmt(s.mid), low, 'decimal', low === 'middle' ? 'Middle stack' : 'Bottom stack') + '<span class="lbl">×</span>' + reps;
  } else {
    f = inp('lb', fmt(s.lb), 'weight', 'decimal', 'Weight in pounds') + '<span class="lbl">lb ×</span>' + reps;
  }
  return `<div class="editor">${f}<button class="btn-primary done" data-act="done-edit">Done</button></div>`;
}

const isEditing = (i, si) => !!(ui.editing && ui.editing.day === ui.day && ui.editing.i === i && ui.editing.si === si);
const isConfirm = (key) => !!(ui.confirm && ui.confirm.key === key);

// Tapping it is what marks a lift done (Logged); changing numbers alone never does.
function badgeHtml(e) {
  return e.logged ? `<span class="done-mark is-done">${ICON_CHECK}Done</span>` : `<span class="done-mark"><i></i>Done</span>`;
}

function renderExCard(e, i) {
  const key = normalize(e.name);
  const pts = liftPoints(e.name);
  const open = pts.length > 0 && ui.openCharts.has(key);
  let chart = '';
  if (open) {
    const cid = 'card:' + key;
    const sel = registerChart(cid, {
      values: pts.map((p) => p.weight), dates: pts.map((p) => p.date), minSpan: 10, floor0: true, height: 130,
      label: `${e.name} top weight`, detail: (j) => cardDetail(pts, j),
    });
    chart = `<div class="ex-chart"><div class="chart-host" data-chart-host="${esc(cid)}" style="height:130px"></div>` +
      `<div class="row"><span class="ch-line" data-chart-detail="${esc(cid)}">${cardDetail(pts, sel)}</span><button class="txt" data-act="full-history" data-i="${i}">Full history ›</button></div></div>`;
  }
  let body;
  if (!e.sets.length) {
    body = `<div class="track-pick"><p>New exercise — how do you track it?</p><div class="pills">` +
      FORMATS.map(([f, label]) => `<button class="pill" data-act="pick-track" data-i="${i}" data-track="${f}">${label}</button>`).join('') +
      `<button class="pill${e.uni ? ' on' : ''}" data-act="pick-uni" data-i="${i}" aria-pressed="${!!e.uni}">Left / right</button></div></div>`;
  } else {
    body = sideLine(e, i) + `<div class="range-slot">${rangeLine(e)}</div>` +
      `<div class="sets">${e.sets.map((s, si) => `<div class="set" data-row="${i}-${si}">${setRowInner(s, i, si, e)}</div>${isEditing(i, si) ? editorHtml(s) : ''}`).join('')}</div>`;
  }
  const rmOn = isConfirm('rm-' + i);
  const foot = `<div class="ex-foot">${e.sets.length ? `<button class="txt" data-act="add-set" data-i="${i}">+ Add set</button>` : ''}<span class="foot-r">` +
    (e.sets.length > 1 ? `<button class="txt muted" data-act="remove-set" data-i="${i}">Remove set</button>` : '') +
    `<button class="txt${rmOn ? ' danger' : ''}" data-act="remove-ex" data-i="${i}">${rmOn ? 'Tap again to skip' : "Didn't do it"}</button></span></div>`;
  // With sets, "Add a note" lives in the ⋯ panel so a long name keeps room in the head.
  const noNote = !noteOf(e.name) && !isNoteEdit(e.name) && !e.sets.length;
  const editOn = e.sets.length > 0 && isLiftEdit(e.name);
  return `<article class="card ex${e.logged ? ' is-logged' : ''}" data-ex="${i}"><div class="ex-head"><span class="grip" aria-hidden="true">${ICON_GRIP}</span><div class="ex-name">${esc(e.name)}</div><div class="ex-tools">` +
    (noNote ? `<button class="icon-btn" data-act="note-edit" data-name="${esc(e.name)}" aria-label="Add a note to ${esc(e.name)}">${ICON_NOTE}</button>` : '') +
    (pts.length ? `<button class="icon-btn${open ? ' on' : ''}" data-act="chart-toggle" data-i="${i}" aria-pressed="${open}" aria-label="${open ? 'Hide' : 'Show'} ${esc(e.name)} chart">${ICON_CHART}</button>` : '') +
    (e.sets.length ? `<button class="icon-btn${editOn ? ' on' : ''}" data-act="lift-edit" data-name="${esc(e.name)}" aria-expanded="${editOn}" aria-label="${esc(e.name)}: change how it's tracked, take it off or delete it">${ICON_MORE}</button>` : '') +
    `<button class="badge-btn" data-act="toggle-logged" data-i="${i}" aria-pressed="${!!e.logged}" aria-label="${esc(e.name)} done">${badgeHtml(e)}</button></div></div>` +
    (editOn ? liftPanelHtml(e, i) : '') + noteHtml(e.name) + chart + body + foot + '</article>';
}

// How a lift is tracked: its format and left/right. He changes it here instead of making a new
// exercise (Chris, 2026-11-07). Shown on a card's ⋯ panel and on the lift's own page.
const isLiftEdit = (name) => ui.liftEdit != null && sameName(ui.liftEdit, name);
const curTrack = (name) => trackOf(name) || ((lastFinishedSets(name) || [])[0] || {}).kind || 'lb';
function trackPickHtml(name) {
  const cur = curTrack(name), uni = uniOf(name), nm = esc(name);
  return `<p class="sub-label">How you track it</p>` +
    `<div class="pills" role="radiogroup" aria-label="How you track ${nm}">${formatsFor(name).map(([f, label]) =>
      `<button class="pill${cur === f ? ' on' : ''}" data-act="lift-track" data-name="${nm}" data-track="${f}" role="radio" aria-checked="${cur === f}">${label}</button>`).join('')}</div>` +
    `<div class="pills"><button class="pill${uni ? ' on' : ''}" data-act="lift-uni" data-name="${nm}" aria-pressed="${uni}">Left / right</button></div>` +
    `<p class="note">Switches today's sets and every workout after. Past workouts stay as you logged them.</p>`;
}
// The ⋯ panel on a card: how it's tracked, then the two ways to get rid of it for good.
// ("Didn't do it" at the bottom of the card is for today only.)
function liftPanelHtml(e, i) {
  const nm = esc(e.name), dayName = DAY_NAME[ui.day];
  const dropOn = isConfirm('drop-' + i);
  const del = ui.delAsk && sameName(ui.delAsk, e.name) ? delPanel(e.name)
    : `<button class="txt danger" data-act="del-ask" data-name="${nm}">Delete ${nm}</button><p class="note">Gone from every day and your exercise list.</p>`;
  const addNote = !noteOf(e.name) && !isNoteEdit(e.name)
    ? `<button class="txt lift-note" data-act="note-edit" data-name="${nm}">${ICON_NOTE}&nbsp;Add a note</button>` : '';
  return `<div class="lift-panel" role="group" aria-label="${nm} settings">${addNote}${trackPickHtml(e.name)}` +
    `<div class="lift-out"><p class="sub-label">Get rid of it</p>` +

    `<p class="note">Gone from ${dayName} from now on. Add it back any time with + Add exercise.</p>${del}</div>` +
    `<button class="txt muted lift-close" data-act="lift-close">Close</button></div>`;
}

// Top of the rep range means it's time to add weight: today if he hit it last time, next time if he
// hits it today. Predicted reps (guesses) don't count.
function rangeLine(e) {
  const [lo, hi] = rangeOf(e.name);
  const list = (pick) => e.sets.map((s, si) => (pick(s) ? si + 1 : 0)).filter(Boolean);
  const sets = (l) => (l.length === 1 ? `set ${l[0]}` : `sets ${l.slice(0, -1).join(', ')} and ${l[l.length - 1]}`);
  const last = list((s) => atTop(e, s));
  if (last.length) return `<p class="range-line">${ICON_UP}<span>Top of ${lo}–${hi} on ${sets(last)} last time. Add weight.</span></p>`;
  const today = list((s) => s.edited && !s.q && s.reps != null && s.reps >= hi);
  if (today.length) return `<p class="range-line">${ICON_UP}<span>Top of ${lo}–${hi} on ${sets(today)}. Add weight next time.</span></p>`;
  return '';
}

// Left/right lifts: which side went first last time, and a swap so today's order is what he did.
function sideLine(e, i) {
  if (!e.sets.some((s) => s.side === 'left') || !e.sets.some((s) => s.side === 'right')) return '';
  const first = e.sets.find((s) => s.side).side;
  const prev = lastFinishedSets(e.name, ui.day);
  const was = prev && (prev.find((s) => s.side) || {}).side;
  const label = was ? `Last time: ${was} first${was !== first ? ` · today: ${first} first` : ''}` : `${first.charAt(0).toUpperCase() + first.slice(1)} first`;
  return `<div class="side-line"><span>${label}</span><button class="txt" data-act="swap-sides" data-i="${i}">Start with ${otherSide(first)}</button></div>`;
}

function cardDetail(pts, j) {
